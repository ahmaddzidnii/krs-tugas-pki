services:
  krs-tugas-pki:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextjs-standalone-image
    container_name: nextjs-standalone-container
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - cloudflare
    ports:
      - "3000:3000"
    restart: unless-stopped

networks:
  cloudflare:
    external: true
